<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%" style="background:#F9F8F6; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .label-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
      .text-title { font-size: 22px; font-weight: 700; fill: #18181B; }
      .text-step-num { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; fill: #C2410C; }
      .text-step-name { font-size: 16px; font-weight: 700; fill: #18181B; }
      .text-prompt { font-size: 13px; font-weight: 400; fill: #52525B; line-height: 1.4; }
      .card-bg { fill: #FFFFFF; stroke: #E4E4E7; stroke-width: 1; }
      .rule-bg { fill: #18181B; }
      .rule-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 600; fill: #FAFAFA; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- HEADER -->
  <g transform="translate(80, 50)">
    <text class="label-mono" fill="#C2410C" x="0" y="0">Methodology</text>
    <text class="text-title" x="0" y="28">How to Read the Diagnostic Matrix</text>
  </g>

  <!-- 5-STEP SEQUENCE -->
  <g transform="translate(80, 120)">
    
    <!-- Step 1 -->
    <rect x="0" y="0" width="265" height="200" rx="3" class="card-bg"/>
    <text class="text-step-num" x="24" y="38">01</text>
    <text class="text-step-name" x="24" y="68">Symptom</text>
    <text class="text-prompt" x="24" y="105">What surface metric</text>
    <text class="text-prompt" x="24" y="125">is dropping?</text>

    <!-- Arrow 1-2 -->
    <text x="278" y="105" font-size="18" fill="#A1A1AA" text-anchor="middle">→</text>

    <!-- Step 2 (Highlighted) -->
    <rect x="294" y="0" width="265" height="200" rx="3" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text class="text-step-num" x="318" y="38">02</text>
    <text class="text-step-name" x="318" y="68">Evidence</text>
    <text class="text-prompt" x="318" y="105">What data separates</text>
    <text class="text-prompt" x="318" y="125">correlation from cause?</text>

    <!-- Arrow 2-3 -->
    <text x="572" y="105" font-size="18" fill="#A1A1AA" text-anchor="middle">→</text>

    <!-- Step 3 -->
    <rect x="588" y="0" width="265" height="200" rx="3" class="card-bg"/>
    <text class="text-step-num" x="612" y="38">03</text>
    <text class="text-step-name" x="612" y="68">Competing Causes</text>
    <text class="text-prompt" x="612" y="105">What are the two</text>
    <text class="text-prompt" x="612" y="125">distinct explanations?</text>

    <!-- Arrow 3-4 -->
    <text x="866" y="105" font-size="18" fill="#A1A1AA" text-anchor="middle">→</text>

    <!-- Step 4 -->
    <rect x="882" y="0" width="265" height="200" rx="3" class="card-bg"/>
    <text class="text-step-num" x="906" y="38">04</text>
    <text class="text-step-name" x="906" y="68">Diagnosis</text>
    <text class="text-prompt" x="906" y="105">Which specific link</text>
    <text class="text-prompt" x="906" y="125">in the system failed?</text>

    <!-- Arrow 4-5 -->
    <text x="1160" y="105" font-size="18" fill="#A1A1AA" text-anchor="middle">→</text>

    <!-- Step 5 -->
    <rect x="1176" y="0" width="264" height="200" rx="3" class="card-bg"/>
    <text class="text-step-num" x="1200" y="38">05</text>
    <text class="text-step-name" x="1200" y="68">Action</text>
    <text class="text-prompt" x="1200" y="105">What is the high-leverage</text>
    <text class="text-prompt" x="1200" y="125">structural fix?</text>
  </g>

  <!-- MICRO-RULE BANNER -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="1440" height="54" rx="3" class="rule-bg"/>
    <text class="rule-text" x="720" y="32" text-anchor="middle">RULE: NEVER JUMP FROM COLUMN 01 (SYMPTOM) DIRECTLY TO COLUMN 05 (ACTION).</text>
  </g>
</svg>
